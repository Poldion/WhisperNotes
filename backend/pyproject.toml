[project]
name = "whispernotes"
version = "0.1.0"
description = "FastAPI-Wrapper um whisper.cpp mit On-Demand-Prozessmanagement, OpenAI-kompatibler API und Dashboard"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    # Beide explizit und gleich gepinnt: sherpa-onnx enthält nur die Python-Erweiterung, die Bibliotheken
    # (libonnxruntime.dylib) liegen in sherpa-onnx-core – uv hat das Core-Paket auf macOS sonst weggelassen.
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Alternative Sprechererkennung (PyTorch, ~1–2 GB). Installation: `uv sync --extra pyannote` –
# deploy/setup_mac.sh macht das automatisch, sobald HF_TOKEN in backend/.env steht.
pyannote = [
    "pyannote.audio>=4.0.7",
]

[tool.uv]
package = false  # Anwendung, kein installierbares Paket

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
